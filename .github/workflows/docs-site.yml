name: Docs site

# Keeps the "develop (unreleased)" version of docs.tubematic.ai current: every push to develop that
# touches docs/ syncs it into the site repo, which Vercel deploys. Released versions are synced by
# release.yml's publish-docs job once a Release is published. workflow_dispatch is the manual
# re-run -- for develop, or to re-sync a release whose publish-docs job failed.
on:
  push:
    branches:
      - develop
    paths:
      - "docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: '"develop", or a release version X.Y.Z (no "v") whose tag exists'
        required: true
        default: develop

# The site repo is reached with TUBEMATIC_DOCS_TOKEN, not GITHUB_TOKEN, so this repo needs read only.
permissions:
  contents: read

# One sync at a time across this workflow and release.yml's publish-docs, so two pushes to the site
# repo never race each other.
concurrency:
  group: docs-site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # TUBEMATIC_DOCS_TOKEN is an environment secret: only a job naming this environment can read it.
    environment: TubeMatic
    steps:
      - name: Resolve what to sync
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-develop}"   # a push carries no input
          version="${version#v}"
          if [ "$version" = develop ]; then
            ref="${{ github.event_name == 'push' && github.sha || 'develop' }}"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            ref="v$version"
          else
            echo "::error::not \"develop\" or a release version: $INPUT_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # This workflow's own commit, for the sync action itself -- an older release tag predates it.
      - uses: actions/checkout@v4

      # The docs to sync, in their own directory.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: .docs-source

      - uses: ./.github/actions/sync-docs-site
        with:
          version: ${{ steps.target.outputs.version }}
          source: ${{ github.workspace }}/.docs-source
          token: ${{ secrets.TUBEMATIC_DOCS_TOKEN }}
