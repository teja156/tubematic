name: Docs site

# Keeps docs.tubematic.ai current: every push that touches docs/ syncs it into the site repo, which
# Vercel deploys -- a push to develop as the "develop (unreleased)" version, and a push to a release
# line (release/X.Y.x) as that line's version, so a docs fix there needs no patch release. A release
# tag is synced by release.yml's publish-docs job once its Release is published. workflow_dispatch is
# the manual re-run -- for develop, a release line, or a release whose publish-docs job failed.
on:
  push:
    branches:
      - develop
      - "release/*.*.x"
    paths:
      - "docs/**"
  workflow_dispatch:
    inputs:
      version:
        description: '"develop", a release version X.Y.Z (no "v") whose tag exists, or a release line release/X.Y.x'
        required: true
        default: develop

# The site repo is reached with TUBEMATIC_DOCS_TOKEN, not GITHUB_TOKEN, so this repo needs read only.
permissions:
  contents: read

# One sync at a time across this workflow and release.yml's publish-docs, so two pushes to the site
# repo never race each other.
concurrency:
  group: docs-site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # TUBEMATIC_DOCS_TOKEN is an environment secret: only a job naming this environment can read it.
    environment: TubeMatic
    steps:
      - name: Resolve what to sync
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # A push carries no input: it syncs the branch pushed, at the exact commit pushed.
          PUSHED_BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
          PUSHED_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          version="${INPUT_VERSION:-${PUSHED_BRANCH:-develop}}"
          version="${version#v}"
          line=""
          if [ "$version" = develop ]; then
            ref="${PUSHED_SHA:-develop}"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            ref="v$version"
          elif [[ "$version" =~ ^release/([0-9]+)\.([0-9]+)\.x$ ]]; then
            ref="${PUSHED_SHA:-$version}"
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            version=""   # named after the line's newest release, once its tags are fetched
          else
            echo "::error::not \"develop\", a release version or a release/X.Y.x line: $INPUT_VERSION"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "line=$line" >> "$GITHUB_OUTPUT"

      # This workflow's own commit, for the sync action itself -- an older release tag predates it.
      - uses: actions/checkout@v4

      # The docs to sync, in their own directory. A release line needs its history and tags, to find
      # which release it carries.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: .docs-source
          fetch-depth: ${{ steps.target.outputs.line && '0' || '1' }}

      # A release line's docs replace that line's version on the site, labelled with the newest stable
      # release the branch contains. A line with no release yet is never synced: it would publish an
      # unreleased line, and as the highest one it would become "Latest". Its first release syncs it
      # through publish-docs. A push to such a line (cutting it, before its tag) skips quietly; asking
      # for one by hand is an error.
      - name: Name a release line after its newest release
        id: label
        working-directory: .docs-source
        env:
          VERSION: ${{ steps.target.outputs.version }}
          LINE: ${{ steps.target.outputs.line }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$LINE" ]; then
            tag="$(git tag --merged HEAD --list "v$LINE.*" --sort=-v:refname | grep -v -- - | head -n 1 || true)"
            if [ -z "$tag" ]; then
              if [ "$EVENT" = push ]; then
                echo "::notice::release/$LINE.x has no v$LINE.* release yet; its first release syncs it"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::release/$LINE.x contains no v$LINE.* release yet; nothing published to sync"
              exit 1
            fi
            VERSION="${tag#v}"
            echo "Syncing release/$LINE.x as $VERSION's docs"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/sync-docs-site
        if: steps.label.outputs.skip != 'true'
        with:
          version: ${{ steps.label.outputs.version }}
          source: ${{ github.workspace }}/.docs-source
          token: ${{ secrets.TUBEMATIC_DOCS_TOKEN }}
