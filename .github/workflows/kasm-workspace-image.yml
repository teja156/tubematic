name: Kasm workspace image

# Builds and pushes ghcr.io/<owner>/tubematic-kasm-workspace, the image behind the published
# Tubematic Kasm Workspace (kasm_workspace/). By hand only, never on a tag or a branch push: the
# image carries no Tubematic version -- the launch form picks one and the session downloads it --
# so a Tubematic release never needs a rebuild of it. Run this when the base image or the tooling
# in kasm_workspace/dockerfile_tubematic_kasm_workspace changes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag: the Kasm release line the image targets (X.Y.Z)"
        required: true
        default: "1.19.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: kasm-workspace-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be X.Y.Z, got '$TAG'"
            exit 1
          fi

      # The image is ~15 GB unpacked, which does not fit in a stock runner's free space. Drop the
      # preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names must be lowercase, and Actions expressions have no toLower().
      - name: Build and push
        env:
          TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          kasm_workspace/build.sh --image "ghcr.io/$owner/tubematic-kasm-workspace" --push "$TAG"
