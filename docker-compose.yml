name: tubematic

networks:
  tubematic-net:
    driver: bridge

# All host↔container bind mounts live under ~/.tubematic-data/.
#
# A fixed absolute location, not ${PWD} and not configurable: the pipeline
# database (which holds the API keys) and the rendered video library are
# machine state, not properties of a git checkout. Under ${PWD} they lived
# inside the repo, so `rm -rf tubematic && git clone` destroyed both silently,
# and invoking compose from the wrong directory created a second empty tree.
#
# ${HOME} rather than a hardcoded path so this file stays committable. cron
# strips the environment to HOME/LOGNAME/PATH/SHELL, so HOME survives there
# too. Container-side paths (/data, /jobs, /output_videos) are unchanged.
volumes:
  output-videos:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/output_videos
  jobs-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/jobs
  db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/data
  scenes-generated:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/scenes/generated
  # Structured JSONL logs, one file per service per day, read back by Flask at
  # GET /logs. A bind mount so a `docker compose down` does not take the trail
  # with it — which is most of the point, since the failures worth reading
  # about are the ones that took a container with them.
  logs-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/logs
  # Pre-migration database snapshots (TMDEV-91). A bind mount, and separate from
  # db-data on purpose: a backup that lives in the directory it is protecting is
  # not a backup. Never written except when a migration is actually pending.
  backups-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/backups
  # The code sandbox's spool (TMDEV-242): the ONLY thing tubematic-sandbox
  # mounts, shared with tubematic-mcp. Requests go in, results come out.
  sandbox-spool:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/sandbox
  # Installed external visual styles (TMDEV-252), one package folder each.
  # Mounted read-only where a style pack is read; webpack compiles a package
  # from here, which is why the path sits beside scenes/generated.
  styles:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/styles
  # Installs waiting for a person's yes (TMDEV-253): the API and MCP stage a
  # package here, and the API moves it into styles/ once it is confirmed.
  styles-pending:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/styles-pending
  # Where an agent on the host drops a package folder or zip for MCP to stage
  # (the MCP container cannot see the rest of the host).
  styles-incoming:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.tubematic-data/styles-incoming

# Service tokens (TMDEV-152), one file each under ~/.tubematic-data/secrets/,
# written by onboarding and upgrade.py (tubematic_core/auth.py). Compose mounts
# each one read-only at /run/secrets/<name> inside the services listed against
# it, so no secret ever appears in an environment variable or `docker inspect`.
# A missing file stops `up` with "bind source path does not exist": the stack
# fails closed rather than starting without a token.
#
# The render gateway (TMDEV-189) adds three: builtin_renderer_token, the
# built-in renderer's credential (read per request on both sides, so a
# rotation needs no restart), and render_tls_key / render_tls_cert, the
# gateway's self-signed TLS pair. The certificate is what every renderer pins;
# the key never leaves tubematic-api.
secrets:
  api_token:
    file: ${HOME}/.tubematic-data/secrets/api_token
  mcp_token:
    file: ${HOME}/.tubematic-data/secrets/mcp_token
  session_secret:
    file: ${HOME}/.tubematic-data/secrets/session_secret
  builtin_renderer_token:
    file: ${HOME}/.tubematic-data/secrets/builtin_renderer_token
  render_tls_key:
    file: ${HOME}/.tubematic-data/secrets/render_tls_key
  render_tls_cert:
    file: ${HOME}/.tubematic-data/secrets/render_tls_cert

services:
  # ── Flask pipeline API ───────────────────────────────────────────────────
  # Flask only. The MCP server used to share this container — one entrypoint
  # backgrounding Flask and exec'ing MCP — which meant a Flask crash left MCP
  # holding PID 1: the container stayed up, went at most `unhealthy`, and
  # `restart: unless-stopped` never fired. TMDEV-87 gave each its own service
  # so one dead process is one dead container. No rendering happens here
  # either — that is tubematic-renderer below (TMDEV-32).
  #
  # It also serves the render gateway (renderer/api/render_gateway.py), a
  # second Flask app on HTTPS :4443 that renderers call to claim a video,
  # fetch its files and upload the mp4. Not published: the built-in renderer
  # reaches it over tubematic-net, and a remote renderer needs the port
  # published by an override that onboarding writes only when one is set up.
  tubematic-api:
    build:
      context: .
      dockerfile: renderer/Dockerfile
    image: tubematic-renderer-image
    container_name: tubematic-api
    restart: unless-stopped
    command: /app/entrypoint.sh python3 /app/api/server.py
    # Loopback-bound (TMDEV-87): the dashboard reaches Flask over the
    # tubematic-net bridge at http://tubematic-api:4000, which does not use the
    # published port at all — publishing exists only for host-side callers
    # (scripts/poll.py, scripts/status.py, curl), all of which use localhost.
    ports:
      - "127.0.0.1:4000:4000"   # Flask pipeline API (poll.py, host curl)
    volumes:
      - output-videos:/output_videos
      - jobs-data:/jobs
      - db-data:/data
      - scenes-generated:/app/remotion/src/scenes/generated
      # read-write here only: the API installs and removes packages (TMDEV-253)
      - styles:/app/remotion/src/scenes/external:nocopy
      - styles-pending:/styles-pending:nocopy
      - logs-data:/logs
      - backups-data:/backups
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - tubematic-net
    # No env_file: API keys live in the settings table (TMDEV-73), which this
    # container already mounts at /data. A side benefit is that `docker
    # inspect` no longer exposes the whole key set.
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - OUTPUT_BASE_PATH=/output_videos
      - TUBEMATIC_DB=/data/tubematic.db
      - TUBEMATIC_JOBS_DIR=/jobs
      - RENDERER_URL=http://localhost:4000
      - TUBEMATIC_SECRETS_DIR=/run/secrets
      - TUBEMATIC_GATEWAY_PORT=4443
    # Every route but /health and /render/health needs api_token. The gateway
    # serves TLS with render_tls_key + render_tls_cert and accepts the
    # built-in renderer by builtin_renderer_token.
    secrets:
      - api_token
      - builtin_renderer_token
      - render_tls_key
      - render_tls_cert
    healthcheck:
      # Flask only — deliberately says nothing about MCP, so this container's
      # health reflects exactly the process it runs.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── MCP server ───────────────────────────────────────────────────────────
  # The agent's entire interface to the pipeline (mcp/server.py, streamable
  # http on :4100). Reuses the tubematic-api image — no second build — with a
  # different command.
  #
  # Mounts are deliberately the minimum the tools actually use: /data (the DB),
  # /jobs (voice/timeline/scene-config/images), the generated scene tree,
  # /logs (it writes its own JSONL trail; Flask is the only reader), and
  # /backups. That last one is not idle: every one of the three backend
  # services calls migrate() itself rather than assuming another process
  # already has, so each one that migrates must be able to back up first —
  # one that silently could not would fail closed on every start.
  # No output_videos — nothing in mcp/ touches it; voice previews are written
  # by Flask's POST /voices/<id>/preview. No /etc/localtime — no MCP tool
  # formats a local timestamp; that is Flask's hosttz.py.
  tubematic-mcp:
    image: tubematic-renderer-image
    container_name: tubematic-mcp
    restart: unless-stopped
    command: /app/entrypoint.sh python3 /app/mcp/server.py
    # Loopback-bound, and more pointedly than Flask: MCP mutates pipeline
    # state, writes scene files and spends money on paid APIs. /mcp also
    # needs mcp_token, which the agent CLIs send through a helper that reads
    # the token file.
    ports:
      - "127.0.0.1:4100:4100"   # MCP HTTP server (Claude Code)
    volumes:
      - jobs-data:/jobs
      - db-data:/data
      - scenes-generated:/app/remotion/src/scenes/generated
      - styles:/app/remotion/src/scenes/external:ro,nocopy
      - styles-pending:/styles-pending:nocopy
      - styles-incoming:/styles-incoming:ro,nocopy
      - logs-data:/logs
      - backups-data:/backups
      - sandbox-spool:/sandbox
    networks:
      - tubematic-net
    # No env_file — same reason as tubematic-api above.
    environment:
      - TUBEMATIC_DB=/data/tubematic.db
      - TUBEMATIC_JOBS_DIR=/jobs
      - MCP_PORT=4100
      # Where run_code hands code to tubematic-sandbox (TMDEV-242). MCP never
      # runs it itself: with the sandbox down, run_code answers sandbox_unavailable.
      - TUBEMATIC_SANDBOX_DIR=/sandbox
      - TUBEMATIC_SECRETS_DIR=/run/secrets
      # The Cartoon 3D tools post their gate and preview stills to the
      # built-in renderer's stills server, on the GPU when there is one (TMDEV-179);
      # unreachable, they render on this container's CPU instead.
      - TUBEMATIC_STILLS_SERVER=http://tubematic-renderer:4455
    secrets:
      - mcp_token
    healthcheck:
      # MCP only. GET /health is a FastMCP custom_route served beside /mcp.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:4100/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Startup ordering only, and mild at that (TMDEV-91). Schema creation no
    # longer races: every service calls tubematic_core.db.migrate(), which
    # holds a real write lock for its whole run, so two containers reaching a
    # brand-new database at once simply serialize rather than corrupt
    # anything. Waiting for a healthy Flask before starting MCP is a
    # preference for a predictable startup order, not a correctness
    # requirement. Nothing gates MCP at runtime once it is up — a later Flask
    # crash does not stop it, and Flask never depends on MCP in either
    # direction.
    depends_on:
      tubematic-api:
        condition: service_healthy

  # ── Worker ───────────────────────────────────────────────────────────────
  # Every background job that is not a render: publishing, Auto Pilot,
  # video metrics, the weekly price sync, retention, Discord notifications
  # and the stalled-VOICING backstop (renderer/api/worker.py). Its own
  # container, apart from the renderer, so a render (which can take an hour)
  # never holds up a publish or an approval, and recreating the renderer
  # (onboard.py --step gpu does) never interrupts them. Reuses the
  # tubematic-api image with a different command.
  #
  # /output_videos and /jobs because retention deletes a video's mp4 and job
  # directory; /etc/localtime because Auto Pilot's daily limits and a
  # scheduled post's wall time are host-zone days. No scenes-generated: it
  # never reads or writes a scene. styles: it reads installed style packs.
  tubematic-worker:
    image: tubematic-renderer-image
    container_name: tubematic-worker
    restart: unless-stopped
    command: python3 /app/api/worker.py
    volumes:
      - output-videos:/output_videos
      - jobs-data:/jobs
      - db-data:/data
      - logs-data:/logs
      - backups-data:/backups
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # The AI review is told an installed external style's look (its pack).
      - styles:/app/remotion/src/scenes/external:ro,nocopy
    networks:
      - tubematic-net
    # No env_file — same reason as tubematic-api above.
    environment:
      - OUTPUT_BASE_PATH=/output_videos
      - TUBEMATIC_DB=/data/tubematic.db
      - TUBEMATIC_JOBS_DIR=/jobs
    depends_on:
      tubematic-api:
        condition: service_healthy

  # ── Renderer ─────────────────────────────────────────────────────────────
  # The built-in renderer (Remotion + Chromium + ffmpeg;
  # renderer/api/render_agent.py). Its own container so a render OOM/crash
  # only restarts this service, not the API, MCP or the worker. Reuses the
  # tubematic-api image — no second build — with a different command.
  #
  # It has NO database (TMDEV-189): it talks to the render gateway in
  # tubematic-api over HTTPS exactly as a renderer on another machine does —
  # claims a video, downloads its files as one bundle, uploads the finished
  # mp4 — so the built-in renderer exercises the same path every remote one
  # depends on. That is why /data, /output_videos and /backups are gone: the
  # gateway writes the upload into the library, the worker runs the AI review,
  # and this container never migrates anything. What stays:
  # - scenes-generated: renders compile the shared generated-scene tree, as
  #   before (a remote renderer stages the bundle's copy instead);
  # - /jobs, read-write: the Cartoon 3D stills server it runs for the MCP
  #   container reads a video's job files and writes the stills the MCP tools
  #   ask for, under <video>/cartoon/ only (out-path.mjs); renders use the bundle;
  # - /logs: its own JSONL trail for the dashboard's Logs page.
  # It authenticates with builtin_renderer_token and trusts exactly the
  # gateway certificate in render_tls_cert (never the TLS key).
  tubematic-renderer:
    image: tubematic-renderer-image
    container_name: tubematic-renderer
    restart: unless-stopped
    command: python3 /app/api/render_agent.py
    volumes:
      - jobs-data:/jobs
      - scenes-generated:/app/remotion/src/scenes/generated
      - styles:/app/remotion/src/scenes/external:ro,nocopy
      - logs-data:/logs
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - tubematic-net
    # No env_file — same reason as tubematic-api above.
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - TUBEMATIC_JOBS_DIR=/jobs
      - TUBEMATIC_SECRETS_DIR=/run/secrets
      - TUBEMATIC_GATEWAY_URL=https://tubematic-api:4443
      - TUBEMATIC_RENDERER_BUILTIN=1
      # The stills server the renderer runs beside its renders, for the MCP
      # container's Cartoon 3D tools. Compose network only, never published.
      - TUBEMATIC_STILLS_PORT=4455
    secrets:
      - builtin_renderer_token
      - render_tls_cert
    shm_size: '2gb'
    depends_on:
      tubematic-api:
        condition: service_healthy

  # ── Code sandbox ─────────────────────────────────────────────────────────
  # Runs the code the agent hands MCP's run_code tool (TMDEV-242), and nothing
  # else. The agent has no shell and no file writes, and the MCP container holds
  # the credential database, so the code runs HERE, in a container that has:
  # - no network at all (network_mode: none), so not even MCP can be dialled;
  #   the two talk through the spool folder, the only mount;
  # - no database, no secrets and no env keys (no env_file, no `secrets:`);
  # - a read-only root, a size-capped tmpfs for its work folders, no Docker
  #   socket, no privilege escalation, and only the six capabilities the
  #   daemon needs to drop the code to uid 65534 and clean up after it
  #   (CHOWN, SETUID, SETGID, KILL; DAC_OVERRIDE and FOWNER to read and delete
  #   what that uid wrote and to use the spool folder);
  # - a CPU, memory and process ceiling for the whole container.
  # Same image as the backend (no second build); the command bypasses
  # entrypoint.sh, which waits for a database this container does not have.
  # Its health is a heartbeat file in the spool, read by MCP: with no network
  # there is no URL to probe.
  tubematic-sandbox:
    image: tubematic-renderer-image
    container_name: tubematic-sandbox
    restart: unless-stopped
    command: python3 /app/sandbox/daemon.py
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - sandbox-spool:/spool
    environment:
      - SANDBOX_SPOOL=/spool

  # ── Dashboard ──────────────────────────────────────────────────────────────
  # Deliberately no /etc/localtime mount and no env_file here: the dashboard
  # gets the host timezone from GET /pipeline/status (tubematic-api, which
  # does have the mount) and formats with Intl.DateTimeFormat({timeZone}) —
  # a second local source of truth could silently disagree with the API's.
  # (The env_file half of this note is moot since TMDEV-73: no service has
  # one. The dashboard still never sees a raw key — GET /settings masks
  # them. See docs/dashboard.md.)
  #
  # Deliberately no logs-data mount either: the dashboard reads logs over HTTP
  # from tubematic-api, which is what keeps the ticket's "no Docker socket, no
  # docker logs" requirement true by construction rather than by discipline.
  tubematic-dashboard:
    build: ./dashboard
    container_name: tubematic-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - output-videos:/output_videos:ro
    networks:
      - tubematic-net
    environment:
      - RENDERER_URL=http://tubematic-api:4000
      - NODE_ENV=production
      - TUBEMATIC_SECRETS_DIR=/run/secrets
    # api_token to call Flask; session_secret to sign the login cookie. The
    # files are 0644 because this container runs as uid 1001, not the host
    # user; the 0700 secrets directory is what keeps other host users out.
    secrets:
      - api_token
      - session_secret
    healthcheck:
      # wget, not curl: dashboard/Dockerfile's runtime stage is node:20-alpine,
      # which has BusyBox wget but no curl at all (confirmed by running the
      # base image directly) -- unlike tubematic-api/-mcp above, which are
      # Debian-based. Without this, a container with no HEALTHCHECK is
      # reported healthy the instant it starts running, before Next.js has
      # bound its port -- exactly the race TMDEV-91's release smoke test would hit.
      #
      # 127.0.0.1, NOT localhost, and this is the whole difference between a
      # probe that works and one that can never succeed. Alpine's /etc/hosts
      # maps localhost to BOTH 127.0.0.1 and ::1; dashboard/Dockerfile sets
      # HOSTNAME=0.0.0.0 so Next.js binds IPv4 only; and BusyBox wget picks
      # the IPv6 address first and does NOT fall back to IPv4 on refusal.
      # Reproduced directly in node:20-alpine against a 0.0.0.0 listener:
      # `localhost` gives "can't connect to remote host: Connection refused",
      # `127.0.0.1` succeeds. The curl probes above survive `localhost` only
      # because curl retries the other address family; copying their URL
      # shape here is what shipped a permanently-failing healthcheck.
      #
      # /login, not /: every other page redirects there without a session,
      # and the login page is the one route that answers 200 on its own.
      test: ["CMD-SHELL", "wget -q -T 5 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Failures inside start_period do not count toward `retries`, and a
      # success inside it marks the container healthy immediately. Without
      # one, the five-retry budget starts burning at t=0, so a slow cold
      # start is indistinguishable from a broken service -- the container is
      # declared unhealthy at ~75s whether or not it was about to come up.
      # Next.js has to boot a Node process and bind before it can answer,
      # and on a cold CI runner starting four containers at once that is not
      # instant. 45s is a start budget, not a timeout: a service that comes
      # up in 2s is still marked healthy in 2s.
      start_period: 45s
    depends_on:
      tubematic-api:
        condition: service_healthy
